name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Validate non-code files (CITATION.cff, YAML configs, pyproject)
  # ──────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          pip install cffconvert pyyaml

      - name: Validate CITATION.cff
        run: cffconvert --validate -i CITATION.cff

      - name: Validate pyproject.toml
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"

      - name: Validate YAML files
        run: |
          python - <<'PY'
          import pathlib, yaml, sys
          errors = []
          for p in pathlib.Path(".").rglob("*.y*ml"):
              try:
                  with open(p) as f:
                      list(yaml.safe_load_all(f))
              except Exception as e:
                  errors.append(f"{p}: {e}")
          if errors:
              print("YAML errors:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          print("All YAML files parsed successfully.")
          PY

  # ──────────────────────────────────────────────────────────────────────────
  # Lint Python and notebooks (ruff 0.6+ supports .ipynb natively)
  # ──────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python and notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"

      - name: Ruff check (Python + notebooks)
        run: |
          # ruff 0.6+ discovers both .py and .ipynb by default and applies
          # per-file-ignores from pyproject.toml correctly. No nbqa wrapper.
          # Exits 0 cleanly if nothing matches.
          shopt -s globstar nullglob
          if [ -z "$(ls **/*.py **/*.ipynb 2>/dev/null)" ]; then
            echo "No Python files or notebooks yet — skipping."
            exit 0
          fi
          ruff check .

  # ──────────────────────────────────────────────────────────────────────────
  # Lint Markdown (informational only until rules stabilize)
  # ──────────────────────────────────────────────────────────────────────────
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/LICENSE*
            !**/CHANGELOG.md
            !**/CODE_OF_CONDUCT.md
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # Check internal Markdown links.
  # .lycheeignore (regex patterns matched against resolved URLs) is
  # auto-detected from the repo root by lychee.
  # ──────────────────────────────────────────────────────────────────────────
  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            ./**/*.md
          fail: true

  # ──────────────────────────────────────────────────────────────────────────
  # Soft reminder when content-bearing PRs forget CHANGELOG
  # ──────────────────────────────────────────────────────────────────────────
  changelog-reminder:
    name: Changelog reminder (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CHANGELOG was touched
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(concepts|labs|recipes|patterns|projects|tools|math-foundations)/' && ! echo "$changed" | grep -q '^CHANGELOG\.md$'; then
            echo "::warning::This PR touches content but doesn't update CHANGELOG.md. Add an entry under [Unreleased] if the change is meaningful."
          else
            echo "Changelog status OK."
          fi
