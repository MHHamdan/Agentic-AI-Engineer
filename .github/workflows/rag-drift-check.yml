name: RAG router drift check

# Scheduled confidence-drift check on recent live queries. When the window mean drops
# below the baseline band, the router is seeing phrasing it was not trained on -> open
# an issue to start the Lab 39 retraining loop. Not a PR gate.

on:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      window:
        description: "Path to recent-queries JSONL"
        default: "labs/41-operating-the-loop/recent_queries.example.jsonl"

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore per-document corpus map (Lab 46)
        uses: actions/cache@v4
        with:
          path: labs/41-operating-the-loop/canary_corpus.map.json
          key: canary-map-${{ github.run_id }}
          restore-keys: canary-map-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-learn>=1.4" "sentence-transformers>=5.0,<6.0" numpy
      - name: Self-test the drift logic (fast, no model)
        run: python labs/41-operating-the-loop/drift_check.py --self-test
      - name: Canary routing check (hard - a flipped route fails the run)
        run: python labs/41-operating-the-loop/canary.py

      - name: Canary corpus review (non-blocking - flags canaries to revalidate)
        continue-on-error: true
        run: python labs/41-operating-the-loop/canary.py --review

      - name: Run drift check
        id: drift
        run: |
          set +e
          python labs/41-operating-the-loop/drift_check.py \
            --window "${{ github.event.inputs.window || 'labs/41-operating-the-loop/recent_queries.example.jsonl' }}" \
            --canaries labs/41-operating-the-loop/canary_queries.jsonl
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open a retrain-due issue
        if: steps.drift.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "Router retrain due: confidence drift detected",
              body: "The weekly drift check found router confidence below the baseline band on recent queries. Start the maintenance loop: run `rag-maintenance-loop.yml` (prepare phase)."
            });
